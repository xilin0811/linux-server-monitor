
name: linux-monitor-v05

services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile

    image: linux-server-monitor:v0.5-compose

    ports:
      - "127.0.0.1:5003:5000"

    environment:
      MONITOR_SOURCE: host_snapshot
      MONITOR_SNAPSHOT_PATH: /app/data/latest.json
      DB_READ_ONLY: "1"

    volumes:
      - type: bind
        source: ./data
        target: /app/data
        read_only: true
        bind:
          create_host_path: false

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
