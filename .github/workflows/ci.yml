
name: CI - Python Tests

# When should the workflow run?
on:
  push:
    branches:
      - main
      - "feature/**"

  pull_request:
    branches:
      - main

  workflow_dispatch:

# Give the workflow only the repository permissions it needs
permissions:
  contents: read

jobs:
  python-tests:
    name: Python 3.12 / pytest

    runs-on: ubuntu-24.04

    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt

      - name: Check Python syntax
        run: |
          python -m compileall -q app.py database.py monitor.py collect_once.py

      - name: Run automated tests
        run: |
          python -m pytest -v
