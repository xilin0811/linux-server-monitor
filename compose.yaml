
name: linux-monitor-v05

services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile

    image: linux-server-monitor:v0.5-compose

    ports:
      - "127.0.0.1:5003:5000"

    volumes:
      - monitor-v05-compose-data:/app/data

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  monitor-v05-compose-data:
    external: true
