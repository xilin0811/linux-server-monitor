
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ubuntu Server Monitor</title>

    <!-- Load CSS from Flask static directory -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <main class="container">

        <header class="header">
            <div>
                <h1>Ubuntu Server Monitor</h1>
                <p>Real-time Linux system monitoring dashboard</p>
            </div>

            <div class="connection-status" id="status">
                Connecting...
            </div>
        </header>

        <section class="dashboard">

            <!-- CPU Card -->
            <div class="card">
                <h2>CPU Usage</h2>
                <p class="metric-value" id="cpu">--%</p>
                <progress id="cpu-bar" value="0" max="100"></progress>
            </div>

            <!-- Memory Card -->
            <div class="card">
                <h2>Memory Usage</h2>
                <p class="metric-value" id="memory">--%</p>
                <progress id="memory-bar" value="0" max="100"></progress>
            </div>

            <!-- Disk Card -->
            <div class="card">
                <h2>Disk Usage</h2>
                <p class="metric-value" id="disk">--%</p>
                <progress id="disk-bar" value="0" max="100"></progress>
            </div>

            <!-- Uptime Card -->
            <div class="card">
                <h2>System Uptime</h2>
                <p class="metric-value" id="uptime">--</p>
                <p class="metric-description">Time since last boot</p>
            </div>

        </section>

        <footer class="footer">
            <p>Linux Server Monitoring Dashboard</p>
            <p id="last-updated">Waiting for first update...</p>
        </footer>

    </main>

    <!-- Load JavaScript -->
    <script src="{{ url_for('static', filename='dashboard.js') }}"></script>
</body>
</html>
